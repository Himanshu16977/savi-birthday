<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="wandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecc449"/>
      <stop offset="50%" stop-color="#ffd0e0"/>
      <stop offset="100%" stop-color="#b48ee4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Wand stick -->
  <line x1="25" y1="75" x2="65" y2="35" stroke="#ecc449" stroke-width="4" stroke-linecap="round"/>
  <!-- Star topper -->
  <polygon points="70,18 73,28 83,28 75,34 78,44 70,38 62,44 65,34 57,28 67,28" fill="url(#wandGrad)" filter="url(#glow)"/>
  <!-- Little magical sparkles -->
  <circle cx="35" cy="30" r="2.5" fill="#ffd0e0" opacity="0.8"/>
  <circle cx="85" cy="50" r="2" fill="#cfb7f0" opacity="0.9"/>
  <circle cx="50" cy="15" r="2" fill="#ecc449" opacity="0.75"/>
</svg>

