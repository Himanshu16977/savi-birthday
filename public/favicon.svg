<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="fairyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5f8" />
      <stop offset="60%" stop-color="#ffd0e0" />
      <stop offset="100%" stop-color="#cfb7f0" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a8" />
      <stop offset="50%" stop-color="#f8dc81" />
      <stop offset="100%" stop-color="#dfb76c" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular background badge -->
  <circle cx="32" cy="32" r="30" fill="url(#fairyGlow)" stroke="#f8dc81" stroke-width="2.5" />

  <!-- Mini Fairytale Crown -->
  <path d="M 18 36 L 22 22 L 28 29 L 32 17 L 36 29 L 42 22 L 46 36 Z" fill="url(#goldGrad)" stroke="#c69f4e" stroke-width="1.2" stroke-linejoin="round" filter="url(#softGlow)" />

  <!-- Crown Jewels & Pearls -->
  <circle cx="22" cy="21" r="2" fill="#ffd0e0" stroke="#c69f4e" stroke-width="0.8" />
  <circle cx="32" cy="16" r="2.5" fill="#f8dc81" stroke="#c69f4e" stroke-width="0.8" />
  <circle cx="42" cy="21" r="2" fill="#ffd0e0" stroke="#c69f4e" stroke-width="0.8" />

  <!-- Crown Band -->
  <rect x="18" y="36" width="28" height="5" rx="2" fill="url(#goldGrad)" stroke="#c69f4e" stroke-width="1" />
  <circle cx="25" cy="38.5" r="1.2" fill="#fff" />
  <circle cx="32" cy="38.5" r="1.5" fill="#e5d7f7" />
  <circle cx="39" cy="38.5" r="1.2" fill="#fff" />

  <!-- Numeral "1" inside crown base -->
  <text x="32" y="52" font-family="'Playfair Display', Georgia, serif" font-size="12" font-weight="bold" fill="#dfb76c" text-anchor="middle" filter="url(#softGlow)">1</text>

  <!-- Little Butterflies & Sparkles -->
  <!-- Sparkle Top-Right -->
  <path d="M 49 14 Q 52 14 52 11 Q 52 14 55 14 Q 52 14 52 17 Q 52 14 49 14 Z" fill="#f8dc81" />
  <!-- Sparkle Left -->
  <path d="M 11 28 Q 13 28 13 26 Q 13 28 15 28 Q 13 28 13 30 Q 13 28 11 28 Z" fill="#ffd0e0" />
</svg>

